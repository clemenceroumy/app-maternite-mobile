name: app_maternite_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  http: ^1.6.0
  go_router: ^17.5.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  flutter_map: ^8.3.1
  supabase: ^2.16.1
  graphql: ^5.2.4
  provider: ^6.1.5+1
  material_ui: any
  injectable: ^3.0.0
  get_it: ^9.2.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  graphql_codegen: ^3.0.2
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  build_runner: ^2.16.0

  # The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package.
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
